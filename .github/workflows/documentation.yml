# This workflow builds and validates the documentation

name: Documentation

on:
  push:
    branches: [ 4.0.* ]
  pull_request:
    branches: [ 4.0.* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    name: Documentation build and validation
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: liberica
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build reference documentation
        run: ./gradlew :spring-credhub-docs:asciidoctor --no-parallel
      - name: Build API documentation
        run: ./gradlew api --no-parallel
      - name: Build module javadocs
        run: ./gradlew javadoc javadocJar
      - name: Build documentation ZIP
        run: ./gradlew docsZip --no-parallel
      - name: Validate documentation outputs
        run: |
          # Check that HTML reference documentation was generated
          test -f spring-credhub-docs/build/docs/asciidoc/index.html
          echo "✅ HTML documentation generated"

          # Check that the docs ZIP was created
          test -f build/distributions/spring-credhub-*-docs.zip
          echo "✅ Documentation ZIP created"

          # Check aggregated API documentation
          test -f build/api/index.html
          echo "✅ API documentation generated"

          # Check module javadoc JARs
          test -f spring-credhub-core/build/libs/spring-credhub-core-*-javadoc.jar
          echo "✅ Core module javadoc JAR generated"

          test -f spring-credhub-starter/build/libs/spring-credhub-starter-*-javadoc.jar
          echo "✅ Starter module javadoc JAR generated"

          # Verify javadoc JAR sizes are reasonable (not empty stubs)
          core_size=$(find spring-credhub-core/build/libs -name "*-javadoc.jar" -exec wc -c {} \; | awk '{print $1}')
          if [ "$core_size" -gt 100000 ]; then
            echo "✅ Core javadoc JAR size reasonable: $core_size bytes"
          else
            echo "❌ Core javadoc JAR too small: $core_size bytes"
            exit 1
          fi

          starter_size=$(find spring-credhub-starter/build/libs -name "*-javadoc.jar" -exec wc -c {} \; | awk '{print $1}')
          if [ "$starter_size" -gt 20000 ]; then
            echo "✅ Starter javadoc JAR size reasonable: $starter_size bytes"
          else
            echo "❌ Starter javadoc JAR too small: $starter_size bytes"
            exit 1
          fi

          # Check documentation content
          grep -q "Spring CredHub" spring-credhub-docs/build/docs/asciidoc/index.html
          echo "✅ Documentation content validated"

          echo "📊 Documentation build summary:"
          echo "HTML pages: $(find spring-credhub-docs/build/docs/asciidoc -name '*.html' | wc -l)"
          echo "ZIP size: $(du -h build/distributions/spring-credhub-*-docs.zip | cut -f1)"
          echo "Javadoc JARs: $(find . -name '*-javadoc.jar' | wc -l)"
