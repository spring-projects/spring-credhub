plugins {
	id 'checkstyle'
	id 'io.spring.nohttp'
	id 'io.spring.javaformat'
}

description = "Spring CredHub"

ext {
	javadocLinks = [
			"https://docs.oracle.com/en/java/javase/17/docs/api/",
			"https://docs.spring.io/spring-framework/docs/current/javadoc-api/"
	] as String[]
}

configure(allprojects) {
	apply plugin: 'java'
	apply plugin: 'eclipse'
	apply plugin: 'checkstyle'
	apply plugin: 'io.spring.nohttp'
	apply plugin: 'io.spring.javaformat'

	group = 'org.springframework.credhub'

	checkstyle {
		toolVersion = "9.3"
		configDirectory.set(rootProject.file("src/checkstyle"))
	}

	nohttp {
		allowlistFile = rootProject.file("src/nohttp/allowlist.lines")
	}

	dependencies {
		checkstyle("io.spring.javaformat:spring-javaformat-checkstyle:0.0.47")
	}
}

configure(libraryProjects) {
	apply plugin: 'java-library'

	java {
		withJavadocJar()
		withSourcesJar()
	}

	javadoc {
		options.encoding = 'UTF-8'
		options.memberLevel = JavadocMemberLevel.PROTECTED
		options.author = true
		options.header = project.name
	}

	sourcesJar {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		archiveClassifier.set "sources"
		from sourceSets.main.allJava
	}

	javadocJar {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		archiveClassifier.set "javadoc"
		from javadoc
	}
}

configure(publishedProjects) {
	apply from: "${rootProject.projectDir}/publish-maven.gradle"
}

subprojects {
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		def compilerArgs = [
				"-Xlint:serial",
				"-Xlint:varargs",
				"-Xlint:cast",
				"-Xlint:classfile",
				"-Xlint:dep-ann",
				"-Xlint:divzero",
				"-Xlint:empty",
				"-Xlint:finally",
				"-Xlint:overrides",
				"-Xlint:path",
				"-Xlint:-processing",
				"-Xlint:static",
				"-Xlint:try",
				"-Xlint:fallthrough",
				"-Xlint:rawtypes",
				"-Xlint:deprecation",
				"-Xlint:unchecked",
				"-Xlint:options",
				"-Werror"
		]
		options.compilerArgs.addAll(compilerArgs)
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}
	
	// Configure optional feature configurations
	// These provide optional dependencies that are included at compile time
	// This replaces the deprecated registerFeature with main source set approach
	configurations {
		reactiveImplementation
		securityImplementation
		httpclientImplementation

		compileClasspath.extendsFrom(reactiveImplementation)
		compileClasspath.extendsFrom(securityImplementation)
		compileClasspath.extendsFrom(httpclientImplementation)
		runtimeClasspath.extendsFrom(reactiveImplementation)
		runtimeClasspath.extendsFrom(securityImplementation)
		runtimeClasspath.extendsFrom(httpclientImplementation)
		testCompileClasspath.extendsFrom(reactiveImplementation)
		testCompileClasspath.extendsFrom(securityImplementation)
		testCompileClasspath.extendsFrom(httpclientImplementation)
		testRuntimeClasspath.extendsFrom(reactiveImplementation)
		testRuntimeClasspath.extendsFrom(securityImplementation)
		testRuntimeClasspath.extendsFrom(httpclientImplementation)
	}

	dependencies {
		testRuntimeOnly("org.junit.platform:junit-platform-launcher")
		testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
	}

	tasks.withType(Test).configureEach {
		// enable JUnit 5
		useJUnitPlatform()
		scanForTestClasses = true
		group = "verification"

		// add jvm arg to resolve BlockHound issues, see https://github.com/reactor/BlockHound/issues/33
		jvmArgs += [
				"-XX:+AllowRedefinitionToAddDeleteMethods"
		]

		testLogging {
			exceptionFormat = "full"
			events = ["skipped", "failed"]
		}

		// print failed tests after the execution
		def failedTests = []
		addTestListener(new TestListener() {
			void afterTest(TestDescriptor testDescriptor, TestResult result) {
				if (result.resultType == TestResult.ResultType.FAILURE) {
					failedTests << testDescriptor
				}
			}
			void afterSuite(TestDescriptor suite, TestResult result) {
				if (!suite.parent) {
					println "\nTest result: ${result.resultType}"
					println "Test summary: ${result.testCount} tests, " +
							"${result.successfulTestCount} succeeded, " +
							"${result.failedTestCount} failed, " +
							"${result.skippedTestCount} skipped"

					failedTests.each { test -> println "FAILED test: ${test.className} > ${test.name}" }
				}
			}
		})
	}

}

configure(rootProject) {
	tasks.register('sourcesJar', Jar) {
		archiveClassifier.set('sources')
		from sourceSets.main.allSource
	}

	tasks.register('javadocJar', Jar) {
		archiveClassifier.set('javadoc')
		from tasks.named('javadoc')
	}

	tasks.register('api', Javadoc) {
		group = "Documentation"
		description = "Generates aggregated Javadoc API documentation."
		title = "${rootProject.description} ${version} API"

		dependsOn(libraryProjects.collect { it.tasks.named('classes') })

		options.encoding = 'UTF-8'
		options.memberLevel = JavadocMemberLevel.PROTECTED
		options.author = true
		options.header = rootProject.description
		options.links(project.ext.javadocLinks)

		source libraryProjects.collect { project ->
			project.sourceSets.main.allJava
		}

		classpath = files({ libraryProjects.collect { project ->
			project.sourceSets.main.compileClasspath
		}})

		maxMemory = "1024m"
		destinationDir = layout.buildDirectory.dir("api").get().asFile
	}

	tasks.register('docsZip', Zip) {
		dependsOn('api')
		dependsOn(':spring-credhub-docs:asciidoctor')
		group = 'Distribution'
		archiveClassifier.set('docs')
		description = "Builds -${archiveClassifier} archive containing api and reference " +
				"for deployment at docs.spring.io/spring-credhub/docs."

		from(tasks.named('api')) {
			into 'api'
		}
		from(project.tasks.findByPath(':spring-credhub-docs:asciidoctor')) {
			into 'reference'
		}
	}

	tasks.named('assemble').configure {
		dependsOn('docsZip')
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifact tasks.named('sourcesJar')
				artifact tasks.named('javadocJar')
				artifact tasks.named('docsZip')
			}
		}
	}

	tasks.register('dist') {
		dependsOn(tasks.named('assemble'))
		group = "Distribution"
		description = "Builds -dist and -docs distribution archives."
	}
}

def getDocumentationProjects() {
	[project(":spring-credhub-docs")] as Set
}

def getTestProjects() {
	[project(":spring-credhub-integration-tests"),
	 project(":spring-credhub-reactive-integration-tests")] as Set
}

def getJavaProjects() {
	subprojects
}

def getLibraryProjects() {
	javaProjects - documentationProjects - testProjects
}

def getPublishedProjects() {
	libraryProjects + rootProject
}

wrapper {
	gradleVersion = "9.6.1"
	distributionType = Wrapper.DistributionType.ALL
}
