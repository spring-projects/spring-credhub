---
jobs:
  - name: build
    serial: true
    public: true
    plan:
      - get: pull-request
        trigger: true
        version: every
      - task: build-project
        timeout: 1h30m
        privileged: true
        file: pull-request/ci/tasks/build-project.yml
        input_mapping:
          git-repo: pull-request
        vars:
          ci-image-tag: ((ci-image-tag))

resource_types:
  - name: pull-request
    type: registry-image
    source:
      repository: ((spring-credhub-virtual-docker-registry))/teliaoss/github-pr-resource
      username: ((broadcom-jfrog-artifactory-robot-account.username))
      password: ((broadcom-jfrog-artifactory-robot-account.password))
      tag: latest

resources:
  - name: pull-request
    type: pull-request
    check_every: 10s
    source:
      repository: ((spring-credhub-pr-github-pull-requests-repo))
      access_token: ((spring-credhub-pr-github-pull-requests-access-token))
      base_branch: ((branch))
      disable_forks: true
      required_review_approvals: 1
