import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'org.springframework.boot'
	id 'eclipse'
}

description = 'Spring CredHub Integration Tests'

dependencies {
	testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
	testImplementation(project(":spring-credhub-starter"))
	testImplementation("org.springframework.boot:spring-boot-starter-webmvc")
	testImplementation("org.springframework.boot:spring-boot-security-oauth2-client")
	testImplementation("org.springframework.boot:spring-boot-starter-test")
	testImplementation("org.apache.httpcomponents.client5:httpclient5")
}

test {
	onlyIf {
		project.hasProperty("integrationTests")
	}
}

bootJar {
	enabled = false
}
